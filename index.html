<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf3f0">
<title>Javis</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Javis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--blue:#1668e3;--ink:#111;--sub:#6b6f7b;--card:rgba(255,255,255,.72);--line:rgba(0,0,0,.06);--green:#2f8f4e;--red:#d23b3b;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fbeee9}
body{background:linear-gradient(160deg,#fdf1ea 0%,#f9e3ec 30%,#e9e6fb 60%,#dceefc 100%) fixed}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:6px 0 14px}
h2{font-size:20px;font-weight:700;margin:22px 0 10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:var(--r);padding:16px;box-shadow:0 6px 24px rgba(80,60,120,.08);border:1px solid rgba(255,255,255,.7)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{margin-top:12px}.sub{color:var(--sub);font-size:14px}.small{font-size:12px;color:var(--sub)}
.pill{display:flex;align-items:center;gap:10px;background:rgba(240,240,246,.9);border-radius:999px;padding:10px 14px;margin-top:10px;font-size:15px;width:100%;text-align:left}
.pill i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--blue);font-size:14px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.iconbar{display:flex;gap:4px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px}
.iconbar button{width:40px;height:36px;font-size:18px;border-radius:999px}
.seg{display:flex;background:rgba(225,225,235,.7);border-radius:999px;padding:3px}
.seg button{flex:1;padding:7px 12px;border-radius:999px;font-size:14px;color:#333}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.8);font-size:14px}
.chip.on{background:var(--blue);color:#fff}
.btn{background:var(--blue);color:#fff;border-radius:999px;padding:12px 18px;font-weight:600;text-align:center}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid #cfdcf6}
.btn.wide{display:block;width:100%}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:#e8effd;color:var(--blue);font-weight:600}
.badge{background:var(--blue);color:#fff;border-radius:999px;padding:1px 8px;font-size:13px;font-weight:700}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.av.s{width:20px;height:20px;font-size:10px;border:1.5px solid #fff}
.neg{color:var(--red)}.pos{color:var(--green)}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.bar{height:8px;border-radius:8px;background:rgba(0,0,0,.07);overflow:hidden}.bar>div{height:100%;background:var(--green);border-radius:8px}
.x{color:#999;font-size:18px;padding:4px 8px}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
/* tab bar */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(492px,calc(100% - 28px));display:flex;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:6px;box-shadow:0 8px 30px rgba(60,40,120,.15);z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 0;border-radius:22px;color:#666}
#tabs button b{font-size:20px;font-weight:400;line-height:1.2}
#tabs button.on{background:#e8effd;color:var(--blue);font-weight:600}
#fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(env(safe-area-inset-bottom) + 92px);width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;box-shadow:0 8px 20px rgba(22,104,227,.4);z-index:21}
/* sheet */
#mask{position:fixed;inset:0;background:rgba(20,20,40,.25);z-index:40;display:none}
#sheet{position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(170deg,#fff7f3,#f6eefc 55%,#e8f2fd);border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);z-index:41;transition:transform .28s ease}
#sheet.open{transform:translate(-50%,0)}
.sh-h{display:flex;align-items:center;margin-bottom:8px}.sh-h h3{margin:0;font-size:19px;flex:1}
.fld{margin-top:10px}.fld label{display:block;font-size:13px;color:var(--sub);margin:0 0 4px 4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #e3e3ea;background:#fff;border-radius:14px;padding:12px;font-size:16px}
.fld textarea{min-height:90px}
/* chat */
#log{display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:52vh;overflow:auto;padding:4px 2px}
.ub{align-self:flex-end;background:var(--blue);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:85%;font-size:15px}
.ab{align-self:flex-start;background:#fff;padding:12px 14px;border-radius:18px 18px 18px 4px;max-width:92%;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.05);width:92%}
.ac{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ac:last-child{border-bottom:0}
.ac .u{font-size:11px;font-weight:700;color:#777;letter-spacing:.5px;padding:4px 6px;border-radius:8px;background:#f2f2f6}
.ac.undone{opacity:.4;text-decoration:line-through}
.cbox{background:#f7f8fb;border-radius:14px;padding:10px 12px;margin-top:8px}
#cmdbar{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
#cmd{flex:1;border:1px solid #e3e3ea;background:#fff;border-radius:22px;padding:12px 14px;font-size:16px;resize:none;max-height:120px}
.circ{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.circ.b{background:var(--blue);color:#fff}.circ.w{background:#fff;color:var(--blue);border:1px solid #dfe6f5}
.circ.rec{background:#e5484d;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,72,77,.2)}}
.orb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9c8ff,#7b4dff 55%,#3b1fa8);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:0 6px 20px rgba(123,77,255,.4)}
/* habits */
.hb{border-radius:20px;padding:14px;min-height:150px;display:flex;flex-direction:column;position:relative}
.hb .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.7);font-size:17px}
.hb .st{position:absolute;right:12px;top:14px;font-size:13px;font-weight:700;color:var(--blue)}
.ring{width:58px;height:58px;min-width:58px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--blue);position:relative;background:#fff;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ring .rin{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}.heat div{aspect-ratio:1;border-radius:4px;background:#e8e8ef}.heat .d1{background:#9fd3ae}.heat .d2{background:#2f8f4e}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:6px}
.cal .h{font-size:12px;color:var(--sub);font-weight:600}
.cal .d{padding:6px 0 2px;border-radius:12px;min-height:52px}
.cal .d span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:16px}
.cal .d.o{color:#bbb}.cal .d.today span{color:var(--blue);font-weight:700}.cal .d.sel span{background:var(--blue);color:#fff;font-weight:700}
.cal .dots{display:flex;justify-content:center;margin-top:1px;min-height:20px}.cal .dots .av.s{margin-left:-5px}
.sw{width:50px;height:30px;border-radius:30px;background:#ccc;position:relative;flex:none}.sw.on{background:var(--blue)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on::after{left:23px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;display:flex;gap:12px;align-items:center}
.toast button{color:#7fb0ff;font-weight:700}
.sens{filter:blur(6px)}
.swr{position:relative;overflow:hidden;border-radius:14px}.swr .swd{position:absolute;right:0;top:0;bottom:0;width:84px;background:#e5484d;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:0 14px 14px 0}
.swr .swc{position:relative;z-index:1;background:#fdfbfc;transition:transform .2s ease;touch-action:pan-y}.swr .swc.card{background:#fdfbfc}
.swr .it{padding-left:4px;padding-right:4px}.swhint{font-size:11px;color:#aaa;text-align:center;margin-top:6px}
.rcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.rcal .h{text-align:center;font-size:12px;color:var(--sub);font-weight:600}
.rc{background:#f5f4f0;border:1px solid #e8e6e0;border-radius:12px;min-height:92px;padding:5px 4px;display:flex;flex-direction:column;font-size:13px}.rc.we{background:#edf2f0}
.rt{background:#106b57;color:#fff;border-radius:10px;padding:0 6px;display:inline-block;font-weight:700}
.rb{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px}.rb i{width:9px;border-radius:5px 5px 2px 2px;display:block}
.rl{font-size:10px;font-weight:700;text-align:center;line-height:1.2;display:flex;flex-direction:column}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th{color:var(--sub);font-weight:500;text-align:right;padding:6px 0;border-bottom:2px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl td{text-align:right;padding:9px 0;border-bottom:1px solid var(--line)}.tbl .tt td{font-weight:800;border:0}
</style>
</head>
<body>
<div id="app"></div>
<button id="fab" onclick="openCmd();toggleMic()">🎙️</button>
<nav id="tabs"></nav>
<div id="mask" onclick="closeSheet()"></div>
<div id="sheet"></div>
<input type="file" id="bkfile" accept=".json,application/json,text/plain" hidden>
<input type="file" id="rcpt" accept="image/*" capture="environment" hidden>
<script>
// ===== helpers =====
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const pd=s=>{const[a,b,c]=s.slice(0,10).split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const COLORS=['#f08a5d','#6c8cf5','#e85d9c','#43b581','#a66cf5','#f5b041','#3fb7c9','#d9534f'];
const colorOf=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const avatar=(p,cls='')=>`<div class="av ${cls}" style="background:${colorOf(p.name)}">${esc((p.name||'?').trim().split(/\s+/).pop()[0]||'?').toUpperCase()}</div>`;
const daysTo=s=>Math.round((pd(s)-pd(today()))/864e5);

// ===== state =====
const CATS=['Ăn uống','Đi lại','Mua sắm','Hóa đơn','Giải trí','Sức khỏe','Gia đình','Giáo dục','Công việc'];
const CATICON={'Ăn uống':'🍜','Đi lại':'🛵','Mua sắm':'🛍️','Hóa đơn':'🧾','Giải trí':'🎬','Sức khỏe':'💊','Gia đình':'👨‍👩‍👧','Giáo dục':'📚','Công việc':'💼','Thu nhập':'💰','Vay mượn':'🤝'};
const CATCOL={'Ăn uống':'#2f6fdc','Đi lại':'#ec6a34','Mua sắm':'#c9489b','Hóa đơn':'#8a6d3b','Giải trí':'#7b4dff','Sức khỏe':'#2f8f4e','Gia đình':'#e0a21b','Giáo dục':'#178a9b','Công việc':'#555'};
const catIcon=c=>CATICON[c]||'🏷️',catCol=c=>CATCOL[c]||colorOf(c+'x');
const cap=s=>(s=String(s||'').trim())?s[0].toUpperCase()+s.slice(1):'';
const mkTags=n=>{const s=String(n||'').toLowerCase().trim().replace(/\s+/g,'-');return s?[s]:[]};
const nowT=()=>new Date().toTimeString().slice(0,5);
const CATKW={'Ăn uống':'cà phê|cafe|cf|ăn|trưa|sáng|tối|cơm|phở|bún|trà|nước|chợ|siêu thị|bia|nhậu|bánh|vịt|xôi|mì|hủ tiếu|lẩu|gà|ốc|chè|sữa','Đi lại':'grab|xăng|taxi|be |gojek|xe|gửi xe|vé|kích bình|vá|sửa xe|rửa xe|thay nhớt','Mua sắm':'mua|quần|áo|giày|shopee|lazada|tiki','Hóa đơn':'điện|nước|internet|wifi|tiền nhà|thuê nhà|điện thoại|net','Giải trí':'phim|netflix|spotify|game|du lịch|karaoke','Sức khỏe':'thuốc|khám|bệnh viện|gym|spa','Gia đình':'bố|mẹ|con|vợ|chồng|biếu','Giáo dục':'sách|học|khóa'};
const guessCat=t=>{t=' '+t.toLowerCase()+' ';for(const c in CATKW)if(new RegExp(CATKW[c]).test(t))return c;return ''};
const catOf=(c,n)=>(c&&c!=='Khác')?c:(guessCat(n||'')||cap(n)||'Chưa rõ');
const SECTIONS=['Ngày quan trọng','Số đo & size','Món thích','Ăn uống','Sức khỏe','Giấy tờ','Khác'];
const PTYPES=['Gia đình','Yêu thương','Bạn bè','Công việc','Khác'];
function seed(){return{v:1,upd:0,tab:'home',tx:[],rem:[],notes:[],subs:[],receipts:[],
 habits:[
  {id:uid(),name:'Uống 8 ly nước',icon:'💧',kind:'count',target:8,unit:'ly',log:{}},
  {id:uid(),name:'Ăn rau trong bữa chính',icon:'🥗',kind:'count',target:2,unit:'bữa',log:{}},
  {id:uid(),name:'Ngủ trước 23h',icon:'🌙',kind:'check',target:1,unit:'',log:{}},
  {id:uid(),name:'Đọc 20 trang sách',icon:'📖',kind:'count',target:20,unit:'trang',log:{}},
  {id:uid(),name:'Thiền 10 phút',icon:'🍃',kind:'count',target:10,unit:'phút',log:{}},
  {id:uid(),name:'Gọi bố mẹ',icon:'📞',kind:'check',target:1,unit:'',log:{}}],
 people:[{id:uid(),name:'Bố',rel:'Bố',type:'Gia đình',close:true,birthday:'',remind:true,dates:[],fields:[],groups:[],last:''},
  {id:uid(),name:'Mẹ',rel:'Mẹ',type:'Gia đình',close:true,birthday:'',remind:true,dates:[],fields:[],groups:[],last:''}],
 groups:[],me:{name:'Nguyễn Lâm'},startBal:0,goal:{name:'Quỹ tiết kiệm',target:0,saved:0},
 home:{ai:1,rem:1,hab:1,fin:1,sub:1,bday:1,notes:1}}}
let S;try{S=JSON.parse(localStorage.getItem('javis'))}catch(e){}
if(!S||!S.v)S=seed();
let UI={screen:null,finP:'month',finOff:0,habTab:'goal',hDay:today(),calMode:'month',calOff:0,calSel:today(),showAllB:true,pFilter:'Tất cả',pSort:'name',subP:'m',subF:'all',showSens:false};
let db=null,dbDoc=null,saveT=null;
function save(){S.upd=Date.now();try{localStorage.setItem('javis',JSON.stringify(S))}catch(e){}
 if(dbDoc){clearTimeout(saveT);saveT=setTimeout(()=>dbDoc.set({json:JSON.stringify(S)}).catch(()=>{}),700)}}
async function initCloud(){try{if(!window.claude)return;db=await claude.use('db');const user=await claude.use('user');if(!db||!user)return;
 const id=await user.id();dbDoc=db.collection('data/users/'+id).doc('javis');
 const r=await dbDoc.get();let v=r&&(typeof r.data==='function'?r.data():(r.data!==undefined?r.data:r));
 if(v&&v.json){const c=JSON.parse(v.json);if(c&&c.v&&(c.upd||0)>(S.upd||0)){S=c;render()}else save()}else save()
 try{const sn=await db.collection('data/users/'+id).get();const L=[];(sn.docs||[]).forEach(d=>{if(d.id==='javis'||d.id==='settings')return;const x=typeof d.data==='function'?d.data():d.data;if(x&&(x.amount||x.amt))L.push(Object.assign({id:d.id},x))});if(L.length&&importTx(L)){S.imp2=0;migrate2();render()}}catch(e){}}catch(e){console.log('cloud',e)}}
let SAMPLE=null,DICT=null;
let micBase='';
(async()=>{try{if(window.claude&&claude.use){DICT=await claude.use('dictation');if(DICT){
 DICT.onPartial(({text})=>{if(micMute)return;const c=$('#cmd');if(c)c.value=(micBase+' '+text).trim()});
 DICT.onFinal(({text})=>{if(micMute)return;micBase=(micBase+' '+text).trim();const c=$('#cmd');if(c)c.value=micBase});

// ===== money / time parsing =====
const VND={'không':0,'một':1,'mốt':1,'hai':2,'ba':3,'bốn':4,'tư':4,'năm':5,'lăm':5,'nhăm':5,'sáu':6,'bảy':7,'bẩy':7,'tám':8,'chín':9,'mười':10,'mươi':-10,'trăm':-100,'linh':-1,'lẻ':-1};
function viWords(seq){let h=0,v=0;seq.trim().split(/\s+/).forEach(w=>{const d=VND[w];if(d===undefined)return;if(d===-10)v=(v||1)*10;else if(d===-100){h+=(v||1)*100;v=0}else if(d>=0)v+=d});return h+v}
const VNW=Object.keys(VND).join('|');
function normSpeech(t){t=String(t).normalize('NFC');
 t=t.replace(new RegExp('(^|[\\s,])((?:(?:'+VNW+')\\s+)+)(nghìn|ngàn|ngan|nghin|triệu|trieu|tỷ|tỉ|k|ca|ka|củ|chục|đồng)(?![a-zà-ỹđ])','gi'),(m,a,w,u)=>{const n=viWords(w.toLowerCase());return n?a+n+' '+u:m});
 t=t.replace(/(\d)\s*(ca|ka|cá|kà|kha|ká)(?=$|[\s,.;!?])/gi,'$1k');
 t=t.replace(/(\d)\s*(nghìn|ngàn)\s+đồng/gi,'$1 nghìn');
 t=t.replace(/(\d+)\s*(triệu|tr|củ)\s*rưỡi/gi,(m,n)=>n+',5 triệu').replace(/(\d+)\s*(nghìn|ngàn|k)\s*rưỡi/gi,(m,n)=>(+n*1000+500)+'đ');
 t=t.replace(/(\d+)\s*chục(?:\s*(nghìn|ngàn|k))?(?![a-zà-ỹđ])/gi,(m,n)=>(+n*10)+'k');
 t=t.replace(/(\d+)\s*(lít|xị)(?![a-zà-ỹđ])/gi,(m,n)=>(+n*100)+'k');
 return t.replace(/\s{2,}/g,' ').trim()}
function parseMoney(s){s=normSpeech(s).toLowerCase().replace(/(\d)\.(\d{3})/g,'$1$2');
 const m=s.match(/(\d+(?:[.,]\d+)?)\s*(triệu|trieu|tỷ|tỉ|trăm|tr|củ|nghìn|nghin|ngàn|ngan|k|ng|lít|đồng|đ|d|vnd)?(?![a-zà-ỹđ])(?:\s*(\d+))?/);if(!m)return 0;
 let n=parseFloat(m[1].replace(',','.'));const u=m[2]||'';
 if(/tỷ|tỉ/.test(u))n*=1e9;else if(/trăm/.test(u))n*=1e5;else if(/triệu|trieu|tr|củ/.test(u)){n*=1e6;if(m[3])n+=Number(m[3])*Math.pow(10,6-m[3].length)}
 else if(/nghìn|nghin|ngàn|ngan|^k$|^ng$/.test(u))n*=1e3;else if(/^(đồng|đ|d|vnd)$/.test(u)){}else if(/lít/.test(u))n*=1e5;else if(!u&&n<1000)n*=1e3;return Math.round(n)}
const WD={'chủ nhật':0,'cn':0,'thứ hai':1,'thứ 2':1,'thứ ba':2,'thứ 3':2,'thứ tư':3,'thứ 4':3,'thứ năm':4,'thứ 5':4,'thứ sáu':5,'thứ 6':5,'thứ bảy':6,'thứ 7':6};
function parseWhen(t){t=t.toLowerCase();let d=new Date(),h=null,mi=0;
 let m=t.match(/(\d{1,2})\s*(?:giờ|h|:)\s*(\d{1,2})?/);if(m){h=+m[1];mi=+(m[2]||0);if(/rưỡi/.test(t))mi=30;if(/(tối|chiều)/.test(t)&&h<12)h+=12;if(/trưa/.test(t)&&h<11)h+=12}
 if(/ngày mai|\bmai\b/.test(t))d.setDate(d.getDate()+1);else if(/ngày kia|\bmốt\b/.test(t))d.setDate(d.getDate()+2);
 else{for(const k in WD)if(t.includes(k)){let diff=(WD[k]-d.getDay()+7)%7;if(diff===0&&(h===null||h<=d.getHours()))diff=7;d.setDate(d.getDate()+diff);break}}
 {const dd=t.match(/ngày\s+(\d{1,2})(?!\s*\/|\s*tháng)/);if(dd){d=new Date(d.getFullYear(),d.getMonth(),+dd[1]);if(ymd(d)<today())d.setMonth(d.getMonth()+1)}}
 {const w=parseDate(t);if(w)d=pd(w)}
 m=t.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);if(m){d=new Date(m[3]?(m[3].length==2?2000+ +m[3]:+m[3]):d.getFullYear(),m[2]-1,+m[1])}
 if(h===null)h=/tối/.test(t)?20:/chiều/.test(t)?15:/trưa/.test(t)?12:/sáng/.test(t)?8:9;
 return ymd(d)+'T'+pad(h)+':'+pad(mi)}
function parseDate(s){{const w=String(s).match(/(\d{1,2})\s*tháng\s*(\d{1,2})(?:\s*(?:năm)?\s*(\d{4}))?/i);if(w&&+w[2]<=12)return (w[3]||new Date().getFullYear())+'-'+pad(w[2])+'-'+pad(w[1])}const m=String(s).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);const n=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return n?n[0]:''}

const hVal=(h,d)=>h.log[d]||0;const hDone=(h,d)=>hVal(h,d)>=h.target;

function remOn(r,ds){const s=r.at.slice(0,10);if(ds<s)return false;if(ds===s)return true;const a=pd(s),b=pd(ds);
 return r.repeat==='Hằng ngày'||(r.repeat==='Hằng tuần'&&a.getDay()===b.getDay())||(r.repeat==='Hằng tháng'&&a.getDate()===b.getDate())||(r.repeat==='Hằng năm'&&a.getDate()===b.getDate()&&a.getMonth()===b.getMonth())}

function period(p,off){const d=new Date();let a,b,label;
 if(p==='day'){d.setDate(d.getDate()+off);a=b=ymd(d);label=dmy(a)}
 else if(p==='week'){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);a=ymd(m);b=addD(a,6);label=a.slice(8)+'/'+a.slice(5,7)+'–'+b.slice(8)+'/'+b.slice(5,7)}
 else if(p==='month'){const m=new Date(d.getFullYear(),d.getMonth()+off,1);a=ymd(m);b=ymd(new Date(m.getFullYear(),m.getMonth()+1,0));label=pad(m.getMonth()+1)+'/'+String(m.getFullYear()).slice(2)}
 else{const y=d.getFullYear()+off;a=y+'-01-01';b=y+'-12-31';label=''+y}return{a,b,label}}

function icsEsc(t){return String(t||'').replace(/[\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function icsBuild(ev){const st=d=>d.replace(/[-:]/g,'').slice(0,15);const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const RR={'Hằng ngày':'DAILY','Hằng tuần':'WEEKLY','Hằng tháng':'MONTHLY','Hằng năm':'YEARLY'}[ev.repeat];
 let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Javis//VI','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+ev.uid+'@javis','DTSTAMP:'+now,'SUMMARY:'+icsEsc(ev.title)];
 if(ev.allDay){const d=ev.date.replace(/-/g,'');const n=addD(ev.date,1).replace(/-/g,'');L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+n)}
 else{const a=ev.at.length===16?ev.at+':00':ev.at;const e=new Date(pd(a.slice(0,10)));e.setHours(+a.slice(11,13),+a.slice(14,16)+30);L.push('DTSTART:'+st(a),'DTEND:'+st(ymd(e)+'T'+pad(e.getHours())+':'+pad(e.getMinutes())+':00'))}
 if(RR)L.push('RRULE:FREQ='+RR);
 const al=ev.allDay?['PT9H']:['-PT15M','PT0M'];al.forEach(t=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(ev.title),'TRIGGER:'+t,'END:VALARM'));
 L.push('END:VEVENT','END:VCALENDAR');return L.join('\r\n')}

document.addEventListener('touchend',()=>{if(!SW)return;const c=SW.c;c.style.transition='';if(SW.lock==='h'){c.dataset.moved=Date.now();const x=SW.base+SW.dx;if(x<-40){c.classList.add('open');c.style.transform='translateX(-84px)'}else{c.classList.remove('open');c.style.transform=''}}SW=null});
function swDel(del){const[coll,id]=del.split(':');const i=S[coll].findIndex(x=>x.id===id);if(i<0)return;const o=S[coll][i];S[coll].splice(i,1);save();render();
 toast(coll==='rem'?'Đã xóa nhắc nhở':coll==='notes'?'Đã xóa ghi chú':'Đã xóa',()=>S[coll].splice(i,0,o))}
const noteRow=n=>swipe(`<div class="it"><div class="sp"><div>${esc(n.text)}</div><div class="small">${dmy(ymd(new Date(n.at)))} ${new Date(n.at).toTimeString().slice(0,5)}</div></div></div>`,'notes:'+n.id,'','','',`fNote(S.notes.find(x=>x.id==='${n.id}'))`);
const remRow=r=>swipe(`<div class="it"><span style="font-size:20px">🔔</span><div class="sp"><b>${esc(r.title)}</b><div class="small">${dmy(r.at)} ${r.at.slice(11,16)}${r.repeat!=='Không'?' · '+r.repeat:''}</div></div></div>`,'rem:'+r.id,'','','',`fRem(S.rem.find(x=>x.id==='${r.id}'))`);
function subRow(s,up){const n=subNext(s);return`<div class="it" onclick="fSub(S.subs.find(x=>x.id==='${s.id}'))"><div class="av" style="border-radius:14px;background:${colorOf(s.name)}">${esc(s.name[0]||'?').toUpperCase()}</div><div class="sp"><b>${esc(s.name)}</b><div class="small">${esc(s.plan||s.cat)} · ${s.cycle==='y'?'Hàng năm':'Hàng tháng'}</div></div><div style="text-align:right"><b>${money(s.amt)}</b><div class="small" style="color:var(--blue)">${daysTo(n)?'Gia hạn sau '+daysTo(n)+' ngày':'Gia hạn hôm nay'}</div></div></div>`}
function habPlus(id){const h=S.habits.find(x=>x.id===id),d=UI.hDay,old=h.log[d]||0;h.log[d]=h.kind==='check'?(old?0:1):old+1;save();render();toast(h.name+': '+h.log[d]+'/'+h.target,()=>{h.log[d]=old})}
function habUndo(id){const h=S.habits.find(x=>x.id===id),d=UI.hDay,old=h.log[d]||0;h.log[d]=Math.max(0,old-1);if(h.kind==='check')h.log[d]=0;save();render()}
function contacted(id){const p=S.people.find(x=>x.id===id),o=p.last;p.last=today();save();render();toast('Đã ghi nhận liên lạc',()=>{p.last=o})}
function fField(id,sec,idx){const p=S.people.find(x=>x.id===id);if(sec==='Ngày quan trọng')return openForm('Ngày quan trọng',[{k:'label',label:'Tên (Ngày kỷ niệm, Ngày cưới…)',value:'Ngày kỷ niệm'},{k:'date',label:'Ngày',type:'date',value:''}],v=>{if(!v.date)return false;p.dates.push(v)});
 const f=idx!=null?p.fields[idx]:null;openForm(sec,[{k:'label',label:'Tên trường (vd: Size quần, Món ăn yêu thích, CCCD…)',value:f?f.label:''},{k:'value',label:'Giá trị',value:f?f.value:''}],v=>{if(!v.label)return false;if(f)Object.assign(f,v);else p.fields.push({sec,...v})},f?`<button class="btn ghost" onclick="S.people.find(x=>x.id==='${id}').fields.splice(${idx},1);closeSheet();save();render()">Xóa</button>`:'')}
function delDate(id,i){const p=S.people.find(x=>x.id===id),x=p.dates[i];p.dates.splice(i,1);save();render();toast('Đã xóa '+x.label,()=>p.dates.splice(i,0,x))}
function fGroup(){openForm('Nhóm mới',[{k:'g',label:'Tên nhóm'}],v=>{if(!v.g)return false;if(!S.groups.includes(v.g))S.groups.push(v.g)})}
function delGroup(g){S.groups=S.groups.filter(x=>x!==g);S.people.forEach(p=>p.groups=(p.groups||[]).filter(x=>x!==g));UI.screen=null;save();render()}
function fMe(){openForm('Hồ sơ của tôi',[{k:'name',label:'Tên',value:S.me.name}],v=>{S.me.name=v.name||S.me.name})}
function fGoal(){openForm('🎯 Mục tiêu tiết kiệm',[{k:'name',label:'Tên mục tiêu',value:S.goal.name},{k:'target',label:'Số tiền mục tiêu',type:'money',value:S.goal.target||''},{k:'saved',label:'Đã có',type:'money',value:S.goal.saved||''}],v=>{Object.assign(S.goal,v)})}
function fSave(){openForm('🐷 Bỏ ống heo',[{k:'a',label:'Số tiền',type:'money'}],v=>{const o=S.goal.saved;S.goal.saved+=v.a||0;setTimeout(()=>toast('Đã bỏ ống '+money(v.a),()=>{S.goal.saved=o}),50)})}
function fFinSet(){openForm('⚙️ Cài đặt tài chính',[{k:'startBal',label:'Số dư ban đầu',type:'money',value:S.startBal||''},{k:'imp',label:'Nhập dữ liệu sao lưu (dán nội dung JSON từ app cũ, không bắt buộc)',type:'textarea'}],v=>{S.startBal=v.startBal||0;if(v.imp){try{const j=JSON.parse(v.imp.slice(v.imp.indexOf('{')));const n=importTx(j.tx||j);setTimeout(()=>toast('Đã nhập '+n+' khoản mới'),50)}catch(e){setTimeout(()=>toast('Dữ liệu sao lưu không đọc được'),50)}}})}
function backupData(){const data=JSON.stringify({app:'javis',ver:1,at:new Date().toISOString(),state:S});const name='javis-saoluu-'+today()+'.json';
 const done=()=>{S.lastBackup=today();save();render();toast('Đã tạo file sao lưu '+name)};
 try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Sao lưu Javis'}).then(done).catch(e=>{if(e&&e.name!=='AbortError')dlBackup(data,name,done)});return}}catch(e){}
 dlBackup(data,name,done)}
function dlBackup(data,name,done){const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);done()}
let RESTORE=null;
$('#bkfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{try{let j=JSON.parse(rd.result);const st=j.state||j;if(!st||!Array.isArray(st.tx))throw 0;RESTORE=st;
  openSheet(`<div class="sh-h"><h3>📂 Khôi phục dữ liệu</h3><button class="x" onclick="closeSheet()">✕</button></div><div class="card"><b>${esc(f.name)}</b><div class="small mt">${j.at?'Sao lưu lúc '+dmy(j.at.slice(0,10))+' · ':''}${st.tx.length} khoản thu chi · ${(st.rem||[]).length} nhắc nhở · ${(st.notes||[]).length} ghi chú · ${(st.habits||[]).length} thói quen · ${(st.people||[]).length} người thân</div></div>
  <button class="btn wide mt" onclick="doRestore('merge')">➕ Gộp vào dữ liệu hiện tại</button><div class="small" style="margin:4px 6px">Giữ dữ liệu đang có, thêm những mục còn thiếu từ file.</div>
  <button class="btn ghost wide mt" onclick="doRestore('replace')">🔄 Thay toàn bộ bằng file này</button><div class="small" style="margin:4px 6px">Dữ liệu hiện tại được cất tạm, có thể hoàn tác.</div>`)}catch(err){toast('File không đúng định dạng sao lưu Javis')}};rd.readAsText(f)});
function doRestore(mode){const st=RESTORE;if(!st)return;const prev=JSON.stringify(S);try{localStorage.setItem('javis_prev',prev)}catch(e){}
 if(mode==='replace'){S=Object.assign(seed(),st);S.tab='home'}
 else{['tx','rem','notes','subs','people','receipts'].forEach(k=>{(st[k]||[]).forEach(x=>{if(typeof x==='string'){if(!S[k].includes(x))S[k].push(x)}else if(!S[k].some(y=>y.id===x.id))S[k].push(x)})});
  (st.habits||[]).forEach(h=>{const m=S.habits.find(y=>y.id===h.id||y.name===h.name);if(!m)S.habits.push(h);else Object.keys(h.log||{}).forEach(d=>m.log[d]=Math.max(m.log[d]||0,h.log[d]))});
  (st.groups||[]).forEach(g=>{if(!S.groups.includes(g))S.groups.push(g)})}
 S.imp1=1;S.imp2=1;S.imp3=1;closeSheet();save();render();toast(mode==='replace'?'Đã khôi phục dữ liệu':'Đã gộp dữ liệu',()=>{S=JSON.parse(prev)})}
function dataSection(){return`<h2>💾 Dữ liệu</h2><div class="card"><div class="small">Dữ liệu chỉ lưu trên máy này. ${S.lastBackup?'Sao lưu lần cuối: <b>'+dmy(S.lastBackup)+'</b>':'<b>Chưa sao lưu lần nào.</b>'}</div>
 <button class="btn wide mt" onclick="backupData()">💾 Sao lưu dữ liệu</button><div class="small" style="margin:4px 6px">iPhone: chọn <b>Lưu vào Tệp</b>, hoặc gửi qua Zalo/email để cất giữ.</div>
 <button class="btn ghost wide mt" onclick="$('#bkfile').click()">📂 Khôi phục từ file sao lưu</button></div>`}
function homeGrid(){const K=[['ai','Thẻ Javis AI'],['rem','Nhắc nhở'],['hab','Thói quen'],['fin','Tài chính'],['sub','Gói đăng ký'],['bday','Sinh nhật sắp tới'],['notes','Ghi chú']];
 openSheet(`<div class="sh-h"><h3>Cài đặt</h3><button class="x" onclick="closeSheet()">✕</button></div><div class="card list">${K.map(k=>`<div class="it"><span class="sp">${k[1]}</span><button class="sw ${S.home[k[0]]?'on':''}" onclick="S.home['${k[0]}']=S.home['${k[0]}']?0:1;this.classList.toggle('on');save();render()"></button></div>`).join('')}</div>${dataSection()}`)}
migrate();initCloud().then(()=>{S.imp2=S.imp2&&!S.tx.some(t=>t.type==='chi'&&(t.cat==='Khác'||!t.tags));migrate()});
render();
</script>
</body>
</html>
